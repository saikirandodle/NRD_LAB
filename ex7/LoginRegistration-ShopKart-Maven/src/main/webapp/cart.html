<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopKart Cart</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
	<nav class="navbar bg-white border-bottom sticky-top">
		<div class="container">
			<a class="navbar-brand text-primary fs-3" href="dashboard.html">🛍️
				ShopKart</a><a href="catalogue.html" class="btn btn-outline-primary">←
				Continue Shopping</a>
		</div>
	</nav>
	<main class="container py-5">
		<div class="row g-4">
			<div class="col-lg-8">
				<h1 class="fw-bold">Shopping Cart</h1>
				<div class="card cart-card p-3 mt-3">
					<div id="items"></div>
				</div>
			</div>
			<div class="col-lg-4">
				<div class="card cart-card p-4">
					<h4>Order Summary</h4>
					<hr>
					<div class="d-flex justify-content-between">
						<span>Subtotal</span><strong>₹<span id="total">0</span></strong>
					</div>
					<div class="d-flex justify-content-between mt-2">
						<span>Delivery</span><strong class="text-success">FREE</strong>
					</div>
					<hr>
					<button class="btn btn-primary btn-lg w-100" onclick="checkout()">Place
						Order</button>
				</div>
			</div>
		</div>
	</main>
	<script>function load(){let c=JSON.parse(localStorage.cart||'[]'),b=items,t=0;b.innerHTML='';if(!c.length){b.innerHTML='<div class="text-center p-5"><div class="display-3">🛒</div><h4>Cart is empty</h4></div>';return}c.forEach((x,i)=>{t+=x.price*x.qty;b.innerHTML+=`<div class="border-bottom py-3 d-flex justify-content-between"><div><h5>${x.name}</h5>₹${x.price.toLocaleString('en-IN')}</div><div><button onclick="chg(${i},-1)" class="btn btn-sm btn-outline-secondary">−</button> ${x.qty} <button onclick="chg(${i},1)" class="btn btn-sm btn-outline-secondary">+</button></div></div>`});total.textContent=t.toLocaleString('en-IN')}function chg(i,n){let c=JSON.parse(localStorage.cart||'[]');c[i].qty+=n;if(c[i].qty<1)c.splice(i,1);localStorage.cart=JSON.stringify(c);load()}function checkout(){if(!JSON.parse(localStorage.cart||'[]').length)return alert('Cart is empty');alert('Order placed successfully!');localStorage.removeItem('cart');load()}load();</script>
</body>
</html>
