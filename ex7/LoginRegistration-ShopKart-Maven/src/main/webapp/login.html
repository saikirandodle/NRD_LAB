<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopKart Login</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container py-5">
		<div class="row justify-content-center">
			<div class="col-md-6 col-lg-5">
				<div class="card auth-card">
					<div class="card-body p-5 text-center">
						<div class="display-4">🛍️</div>
						<h2 class="fw-bold text-primary">Welcome Back</h2>
						<p class="text-muted">Login to continue shopping</p>
						<div id="msg"></div>
						<form action="login" method="post" class="text-start">
							<label class="form-label">Email</label><input type="email"
								name="email" class="form-control mb-3" required><label
								class="form-label">Password</label><input type="password"
								name="password" class="form-control mb-4" required>
							<button class="btn btn-primary btn-lg w-100">Login</button>
						</form>
						<p class="mt-4">
							New to ShopKart? <a href="register.html">Create account</a>
						</p>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script>
		let p = new URLSearchParams(location.search);
		if (p.has('registered'))
			msg.innerHTML = '<div class="alert alert-success">Registration successful. Please login.</div>';
		if (p.has('error'))
			msg.innerHTML = '<div class="alert alert-danger">Invalid email or password.</div>';
		if (p.has('dberror'))
			msg.innerHTML = '<div class="alert alert-danger">Database connection error.</div>';
	</script>
</body>
</html>
