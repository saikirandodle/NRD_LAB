<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopKart Register</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container py-5">
		<div class="row justify-content-center">
			<div class="col-md-7 col-lg-5">
				<div class="card auth-card">
					<div class="card-body p-5 text-center">
						<div class="display-4">🛍️</div>
						<h2 class="fw-bold">Create Account</h2>
						<p class="text-muted">Join ShopKart today</p>
						<div id="msg"></div>
						<form action="register" method="post" class="text-start">
							<label class="form-label">Full Name</label><input type="text"
								name="name" class="form-control mb-3" required><label
								class="form-label">Email</label><input type="email" name="email"
								class="form-control mb-3" required><label
								class="form-label">Password</label><input type="password"
								name="password" class="form-control mb-4" required>
							<button class="btn btn-primary btn-lg w-100">Create
								Account</button>
						</form>
						<p class="mt-4">
							Already registered? <a href="login.html">Login</a>
						</p>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script>
		let p = new URLSearchParams(location.search);
		if (p.has('exists'))
			msg.innerHTML = '<div class="alert alert-warning">Email already registered.</div>';
		if (p.has('error'))
			msg.innerHTML = '<div class="alert alert-danger">Registration failed.</div>';
	</script>
</body>
</html>
