<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopKart Catalogue</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
	<nav class="navbar bg-white border-bottom sticky-top">
		<div class="container">
			<a class="navbar-brand text-primary fs-3" href="dashboard.html">🛍️
				ShopKart</a>
			<div>
				<a class="nav-link d-inline-block me-3" href="dashboard.html">Home</a><a
					class="nav-link d-inline-block" href="cart.html">🛒 Cart</a>
			</div>
		</div>
	</nav>
	<main class="container py-5">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1 class="fw-bold">Product Catalogue</h1>
			<input id="search" class="form-control" style="max-width: 400px"
				placeholder="🔎 Search..." onkeyup="filterP()">
		</div>
		<div class="row g-4" id="products">
			<div class="col-sm-6 col-lg-4 product" data-name="smartphone">
				<div class="card product-card h-100">
					<div class="product-icon">📱</div>
					<div class="card-body">
						<h5>Smartphone</h5>
						<p class="text-muted">128GB · 5G · AMOLED</p>
						<div class="d-flex justify-content-between align-items-center">
							<span class="price">₹24,999</span>
							<button class="btn btn-primary" onclick="add('Smartphone',24999)">Add
								+</button>
						</div>
					</div>
				</div>
			</div>
			<div class="col-sm-6 col-lg-4 product" data-name="laptop">
				<div class="card product-card h-100">
					<div class="product-icon">💻</div>
					<div class="card-body">
						<h5>Laptop</h5>
						<p class="text-muted">16GB RAM · SSD</p>
						<div class="d-flex justify-content-between align-items-center">
							<span class="price">₹54,999</span>
							<button class="btn btn-primary" onclick="add('Laptop',54999)">Add
								+</button>
						</div>
					</div>
				</div>
			</div>
			<div class="col-sm-6 col-lg-4 product" data-name="headphones">
				<div class="card product-card h-100">
					<div class="product-icon">🎧</div>
					<div class="card-body">
						<h5>Headphones</h5>
						<p class="text-muted">Wireless · Noise cancelling</p>
						<div class="d-flex justify-content-between align-items-center">
							<span class="price">₹2,499</span>
							<button class="btn btn-primary" onclick="add('Headphones',2499)">Add
								+</button>
						</div>
					</div>
				</div>
			</div>
			<div class="col-sm-6 col-lg-4 product" data-name="smart watch">
				<div class="card product-card h-100">
					<div class="product-icon">⌚</div>
					<div class="card-body">
						<h5>Smart Watch</h5>
						<p class="text-muted">Fitness tracking</p>
						<div class="d-flex justify-content-between align-items-center">
							<span class="price">₹3,999</span>
							<button class="btn btn-primary" onclick="add('Smart Watch',3999)">Add
								+</button>
						</div>
					</div>
				</div>
			</div>
			<div class="col-sm-6 col-lg-4 product" data-name="camera">
				<div class="card product-card h-100">
					<div class="product-icon">📷</div>
					<div class="card-body">
						<h5>Camera</h5>
						<p class="text-muted">24MP · 4K Video</p>
						<div class="d-flex justify-content-between align-items-center">
							<span class="price">₹39,999</span>
							<button class="btn btn-primary" onclick="add('Camera',39999)">Add
								+</button>
						</div>
					</div>
				</div>
			</div>
			<div class="col-sm-6 col-lg-4 product" data-name="gaming console">
				<div class="card product-card h-100">
					<div class="product-icon">🎮</div>
					<div class="card-body">
						<h5>Gaming Console</h5>
						<p class="text-muted">Next-gen gaming</p>
						<div class="d-flex justify-content-between align-items-center">
							<span class="price">₹44,999</span>
							<button class="btn btn-primary"
								onclick="add('Gaming Console',44999)">Add +</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>
	<script>function add(n,p){let c=JSON.parse(localStorage.cart||'[]'),x=c.find(a=>a.name===n);x?x.qty++:c.push({name:n,price:p,qty:1});localStorage.cart=JSON.stringify(c);alert(n+' added to cart!')}function filterP(){let q=search.value.toLowerCase();document.querySelectorAll('.product').forEach(x=>x.style.display=x.dataset.name.includes(q)?'':'none')}</script>
</body>
</html>
