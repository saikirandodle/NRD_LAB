<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopKart Dashboard</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
	<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
		<div class="container">
			<a class="navbar-brand text-primary fs-3" href="dashboard.html">🛍️
				ShopKart</a>
			<div>
				<a class="nav-link d-inline-block me-3" href="catalogue.html">Catalogue</a><a
					class="nav-link d-inline-block" href="cart.html">🛒 Cart</a>
			</div>
		</div>
	</nav>
	<main class="container py-4">
		<section class="hero p-4 p-md-5">
			<div class="row align-items-center">
				<div class="col-lg-7">
					<span class="badge bg-light text-primary mb-3">NEW SEASON •
						UP TO 50% OFF</span>
					<h1 class="display-5 fw-bold">
						Everything you love,<br>all in one place.
					</h1>
					<p class="lead">Explore electronics, gadgets and everyday
						essentials.</p>
					<a href="catalogue.html" class="btn btn-light btn-lg">Explore
						Products →</a>
				</div>
				<div class="col-lg-5 text-center display-1">🛍️📦✨</div>
			</div>
		</section>
		<h2 class="fw-bold mt-5">Trending Products</h2>
		<div class="row g-4 mt-1">
			<div class="col-sm-6 col-lg-3">
				<div class="card product-card h-100">
					<div class="product-icon">📱</div>
					<div class="card-body">
						<h5>Smartphone</h5>
						<div class="price">₹24,999</div>
					</div>
				</div>
			</div>
			<div class="col-sm-6 col-lg-3">
				<div class="card product-card h-100">
					<div class="product-icon">💻</div>
					<div class="card-body">
						<h5>Laptop</h5>
						<div class="price">₹54,999</div>
					</div>
				</div>
			</div>
			<div class="col-sm-6 col-lg-3">
				<div class="card product-card h-100">
					<div class="product-icon">🎧</div>
					<div class="card-body">
						<h5>Headphones</h5>
						<div class="price">₹2,499</div>
					</div>
				</div>
			</div>
			<div class="col-sm-6 col-lg-3">
				<div class="card product-card h-100">
					<div class="product-icon">⌚</div>
					<div class="card-body">
						<h5>Smart Watch</h5>
						<div class="price">₹3,999</div>
					</div>
				</div>
			</div>
		</div>
	</main>
</body>
</html>
