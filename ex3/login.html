<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="bg-dark text-white py-3">
    <div class="container">
      <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-2">
        <h1 class="h3 mb-0 headColor">Shopping Cart</h1>
        <nav>
          <ul class="nav">
            <li class="nav-item"><a class="nav-link text-white" href="catalog.html">Catalog</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="index.html">Cart</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="register.html">Register</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="card-title text-center mb-4">Login</h2>
            <form>
              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email address</label>
                <input type="email" class="form-control" id="exampleInputEmail1" placeholder="Enter email">
              </div>
              <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Password</label>
                <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Password">
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary" onclick="validateLogin(); return false;">Submit</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
